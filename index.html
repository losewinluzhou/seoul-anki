<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>韓語閃卡 · 情境應對</title>
<meta name="description" content="韓語旅遊會話情境練習 App">

<!-- PWA / iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="韓語對話">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --surface-light: #2a2a2a;
  --primary: #bb86fc;
  --primary-dim: #9a67db;
  --secondary: #03dac6;
  --accent: #ffb74d;
  --on-bg: #e0e0e0;
  --on-surface: #ffffff;
  --on-muted: #888888;
  --radius: 20px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--on-bg);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== App Shell ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding: env(safe-area-inset-top, 20px) 16px calc(var(--safe-bottom) + 12px);
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 12px 0 8px;
  flex-shrink: 0;
}

.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

/* ===== Progress Bar ===== */
.progress-wrap {
  width: 100%;
  height: 4px;
  background: var(--surface-light);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
  margin-top: 8px;
  margin-bottom: 16px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 2px;
  transition: width 0.3s ease;
  width: 0%;
}

.progress-text {
  text-align: center;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--on-muted);
  letter-spacing: 1px;
  margin-bottom: 8px;
}

/* ===== Card Area ===== */
.card-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 4px 0;
}

/* ===== Single Card ===== */
.card-container {
  width: 100%;
  max-width: 380px;
  aspect-ratio: 3 / 4;
  max-height: 100%;
  cursor: pointer;
  position: relative;
  background: linear-gradient(145deg, #1f1f3a, #1a1a2e);
  border: 1px solid rgba(187, 134, 252, 0.15);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  text-align: center;
  overflow: hidden;
  transition: opacity 0.25s ease, transform 0.25s ease, background 0.3s ease;
}

.card-container.answer-mode {
  background: linear-gradient(145deg, #1a2e1a, #1e2d1e);
  border: 1px solid rgba(3, 218, 198, 0.15);
}

.card-container.fade-out {
  opacity: 0;
  transform: scale(0.97);
}

.card-badge {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--on-muted);
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
}

.card-id {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 0.65rem;
  color: var(--on-muted);
  font-weight: 600;
}

/* Content Layout */
.content-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
}

.text-ko {
  font-size: 1.8rem;
  font-weight: 700;
  line-height: 1.4;
}
.question-mode .text-ko { color: var(--accent); }
.answer-mode .text-ko { color: var(--secondary); }

.text-zh {
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--on-surface);
  line-height: 1.45;
}

.card-hint {
  position: absolute;
  bottom: 20px;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.25);
  letter-spacing: 1px;
}

.speaker-icon {
  margin-top: 8px;
  font-size: 1.4rem;
  opacity: 0.5;
  animation: pulse-speaker 2s infinite;
}

@keyframes pulse-speaker {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* ===== Navigation Buttons ===== */
.nav-area {
  flex-shrink: 0;
  padding: 16px 0 8px;
  display: flex;
  gap: 12px;
}

.btn-nav {
  flex: 1;
  border: none;
  border-radius: 16px;
  padding: 16px 4px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-nav:active {
  transform: scale(0.96);
}

.btn-prev {
  background: var(--surface-light);
  color: var(--on-surface);
}

.btn-next {
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: #fff;
}

.btn-next.finish {
  background: linear-gradient(135deg, var(--secondary), #00b3a6);
}

/* ===== End State ===== */
.empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 16px;
  padding: 40px 20px;
  flex: 1;
}

.empty-state.visible {
  display: flex;
}

.empty-icon {
  font-size: 4rem;
  opacity: 0.7;
}

.empty-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--on-surface);
}

.btn-reset {
  margin-top: 12px;
  padding: 14px 32px;
  border: none;
  border-radius: 14px;
  background: var(--surface-light);
  color: var(--on-surface);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
}

/* ===== Utility ===== */
.hidden { display: none !important; }

/* ===== Responsive Tweaks ===== */
@media (max-height: 667px) {
  .text-zh { font-size: 1.25rem; }
  .text-ko { font-size: 1.5rem; }
  .card-container { aspect-ratio: 4 / 5; }
  .btn-nav { padding: 14px 4px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <h1>🇰🇷 韓語對話特訓</h1>
  </div>

  <!-- Progress -->
  <div class="progress-text" id="progress-text">情境：1 / 50</div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Card -->
  <div class="card-area" id="card-area">
    <div class="card-container question-mode" id="card-container" onclick="handleCardClick()">
      <div class="card-badge" id="card-badge">聽力問題</div>
      <div class="card-id" id="card-id">#1</div>
      
      <div class="content-wrapper">
        <!-- Korean Text (Question or Answer) -->
        <div class="text-ko" id="text-ko"></div>
        <div class="speaker-icon" id="speaker-icon">🔊</div>
        <!-- Chinese Text -->
        <div class="text-zh" id="text-zh">載入中…</div>
      </div>
      
      <div class="card-hint" id="card-hint">點擊看應對策略</div>
    </div>
  </div>

  <!-- End State -->
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🎉</div>
    <div class="empty-title">特訓完成！</div>
    <button class="btn-reset" onclick="resetProgress()">重新開始</button>
  </div>

  <!-- Nav Buttons -->
  <div class="nav-area" id="nav-area">
    <button class="btn-nav btn-prev" onclick="prevStep()">⬅️ 上一步</button>
    <button class="btn-nav btn-next" id="btn-next" onclick="nextStep()">你的應對 ➡️</button>
  </div>
</div>

const elCardHint = document.getElementById('card-hint');
const elProgressText = document.getElementById('progress-text');
const elProgressFill = document.getElementById('progress-fill');
const elBtnNext = document.getElementById('btn-next');
const elCardArea = document.getElementById('card-area');
const elNavArea = document.getElementById('nav-area');
const elEmptyState = document.getElementById('empty-state');

function init() {
  const saved = localStorage.getItem('srs-qa-index');
  if (saved !== null) {
    currentIndex = parseInt(saved, 10);
    if (currentIndex >= cardData.length) currentIndex = 0;
  }
  
  renderCurrentState();
}

function handleCardClick() {
  if (isAnimating) return;
  nextStep();
}

function nextStep() {
  if (isAnimating) return;
  
  if (!isAnswerState) {
    changeState(true);
  } else {
    if (currentIndex < cardData.length - 1) {
      currentIndex++;
      localStorage.setItem('srs-qa-index', currentIndex);
      changeState(false);
    } else {
      showEndState();
    }
  }
}

function prevStep() {
  if (isAnimating) return;

  if (isAnswerState) {
    changeState(false);
  } else {
    if (currentIndex > 0) {
      currentIndex--;
      localStorage.setItem('srs-qa-index', currentIndex);
      changeState(true);
    }
  }
}

function changeState(toAnswer) {
  isAnimating = true;
  elCardContainer.classList.add('fade-out');
  
  setTimeout(() => {
    isAnswerState = toAnswer;
    renderCurrentState();
    
    elCardContainer.classList.remove('fade-out');
    setTimeout(() => { isAnimating = false; }, 250);
  }, 200);
}

function renderCurrentState() {
  const card = cardData[currentIndex];
  
  elProgressText.textContent = `情境：${currentIndex + 1} / ${cardData.length}`;
  elProgressFill.style.width = `${((currentIndex) / cardData.length) * 100}%`;
  elCardId.textContent = '#' + card.id;

  if (isAnswerState) {
    // Show Response
    elCardContainer.classList.add('answer-mode');
    elCardContainer.classList.remove('question-mode');
    elCardBadge.textContent = '你的應對';
    
    elTextKo.style.display = 'block';
    elTextKo.textContent = card.a_ko;
    elTextZh.textContent = card.a_zh;
    elSpeaker.style.display = 'block';
    
    elCardHint.textContent = '點擊進入下一題';
    
    if (currentIndex === cardData.length - 1) {
      elBtnNext.textContent = '完成 🎉';
      elBtnNext.classList.add('finish');
    } else {
      elBtnNext.textContent = '下一題 ➡️';
      elBtnNext.classList.remove('finish');
    }

    speakKorean(card.a_ko);

  } else {
    // Show Prompt / Question
    elCardContainer.classList.remove('answer-mode');
    elCardContainer.classList.add('question-mode');
    elCardBadge.textContent = card.type;
    
    if (card.q_ko) {
      elTextKo.style.display = 'block';
      elTextKo.textContent = card.q_ko;
      elSpeaker.style.display = 'block';
      speakKorean(card.q_ko);
    } else {
      elTextKo.style.display = 'none';
      elSpeaker.style.display = 'none';
    }
    
    elTextZh.textContent = card.q_zh;
    
    elCardHint.textContent = '點擊看應對策略';
    elBtnNext.textContent = '你的應對 ➡️';
    elBtnNext.classList.remove('finish');
  }
}

function showEndState() {
  elCardArea.classList.add('hidden');
  elNavArea.classList.add('hidden');
  elProgressFill.style.width = '100%';
  elEmptyState.classList.add('visible');
  localStorage.setItem('srs-qa-index', 0);
}

function resetProgress() {
  currentIndex = 0;
  isAnswerState = false;
  localStorage.setItem('srs-qa-index', 0);
  elEmptyState.classList.remove('visible');
  elCardArea.classList.remove('hidden');
  elNavArea.classList.remove('hidden');
  renderCurrentState();
}

function speakKorean(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.85;
  utter.pitch = 1;

  const voices = window.speechSynthesis.getVoices();
  const koVoice = voices.find(v => v.lang.startsWith('ko'));
  if (koVoice) utter.voice = koVoice;

  window.speechSynthesis.speak(utter);
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

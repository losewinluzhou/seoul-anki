<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --surface-light: #2a2a2a;
  --primary: #bb86fc;
  --primary-dim: #9a67db;
  --secondary: #03dac6;
  --error: #cf6679;
  --warning: #ffb74d;
  --success: #81c784;
  --on-bg: #e0e0e0;
  --on-surface: #ffffff;
  --on-muted: #888888;
  --radius: 20px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--on-bg);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== App Shell ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding: env(safe-area-inset-top, 20px) 16px calc(var(--safe-bottom) + 12px);
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 12px 0 8px;
  flex-shrink: 0;
}

.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

/* ===== Stats Bar ===== */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px 0 6px;
  flex-shrink: 0;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1;
}

.stat-label {
  font-size: 0.7rem;
  color: var(--on-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}

.stat-new .stat-value { color: var(--secondary); }
.stat-review .stat-value { color: var(--primary); }
.stat-done .stat-value { color: var(--success); }

/* ===== Progress Bar ===== */
.progress-wrap {
  width: 100%;
  height: 4px;
  background: var(--surface-light);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}

/* ===== Card Area ===== */
.card-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
  min-height: 0;
  padding: 4px 0;
}

/* ===== Flip Card ===== */
.card-container {
  width: 100%;
  max-width: 380px;
  aspect-ratio: 3 / 4;
  max-height: 100%;
  cursor: pointer;
  position: relative;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
  transform-style: preserve-3d;
}

.card-container.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  text-align: center;
  overflow: hidden;
}

.card-front {
  background: linear-gradient(145deg, #1f1f3a, #1a1a2e);
  border: 1px solid rgba(187, 134, 252, 0.15);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}

.card-back {
  background: linear-gradient(145deg, #1a2e1a, #1e2d1e);
  border: 1px solid rgba(3, 218, 198, 0.15);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  transform: rotateY(180deg);
}

.card-badge {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--on-muted);
  font-weight: 600;
}

.card-id {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 0.65rem;
  color: var(--on-muted);
  font-weight: 600;
}

.card-text-zh {
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--on-surface);
  line-height: 1.45;
  letter-spacing: 0.5px;
}

.card-text-ko {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--secondary);
  line-height: 1.5;
  margin-bottom: 12px;
}

.card-text-zh-small {
  font-size: 1rem;
  color: var(--on-muted);
  margin-top: 12px;
  line-height: 1.4;
}

.card-hint {
  position: absolute;
  bottom: 20px;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.25);
  letter-spacing: 1px;
}

.speaker-icon {
  margin-top: 16px;
  font-size: 1.6rem;
  opacity: 0.5;
  animation: pulse-speaker 2s infinite;
}

@keyframes pulse-speaker {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* ===== Rating Buttons ===== */
.rating-area {
  flex-shrink: 0;
  padding: 8px 0 4px;
}

.rating-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.btn-rate {
  border: none;
  border-radius: 14px;
  padding: 14px 4px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-height: 56px;
  -webkit-tap-highlight-color: transparent;
}

.btn-rate:active {
  transform: scale(0.93);
}

.btn-rate .btn-interval {
  font-size: 0.6rem;
  font-weight: 500;
  opacity: 0.7;
}

.btn-again {
  background: rgba(207, 102, 121, 0.2);
  color: var(--error);
  border: 1px solid rgba(207, 102, 121, 0.3);
}

.btn-hard {
  background: rgba(255, 183, 77, 0.15);
  color: var(--warning);
  border: 1px solid rgba(255, 183, 77, 0.25);
}

.btn-good {
  background: rgba(129, 199, 132, 0.15);
  color: var(--success);
  border: 1px solid rgba(129, 199, 132, 0.25);
}

.btn-easy {
  background: rgba(3, 218, 198, 0.15);
  color: var(--secondary);
  border: 1px solid rgba(3, 218, 198, 0.25);
}

/* ===== Empty State ===== */
.empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 16px;
  padding: 40px 20px;
  flex: 1;
}

.empty-state.visible {
  display: flex;
}

.empty-icon {
  font-size: 4rem;
  opacity: 0.7;
}

.empty-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--on-surface);
}

.empty-subtitle {
  font-size: 0.9rem;
  color: var(--on-muted);
  line-height: 1.5;
}

.btn-reset {
  margin-top: 12px;
  padding: 14px 32px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.btn-reset:active {
  transform: scale(0.95);
}

/* ===== Hidden Utility ===== */
.hidden { display: none !important; }

/* ===== Swipe Hint Animation ===== */
@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-container {
  animation: fade-in-up 0.35s ease-out;
}

/* ===== Responsive Tweaks ===== */
@media (max-height: 667px) {
  .card-text-zh { font-size: 1.35rem; }
  .card-text-ko { font-size: 1.5rem; }
  .card-container { aspect-ratio: 4 / 5; }

  .stats-bar { gap: 14px; padding: 6px 0; }
  .stat-value { font-size: 1.3rem; }
}

@media (min-height: 900px) {
  .card-text-zh { font-size: 1.9rem; }
  .card-text-ko { font-size: 2.1rem; }
}
</style>

// ===== Constants =====
const STORAGE_KEY = 'korean-srs-cards';
const MS_PER_DAY = 86400000;
const MS_PER_MIN = 60000;

// ===== State =====
let cards = [];         // full deck with SRS state
let queue = [];         // today's review queue
let currentIndex = 0;
let isFlipped = false;
let sessionDone = 0;    // cards reviewed this session
let sessionTotal = 0;

// ===== DOM Refs =====
const elCardContainer = document.getElementById('card-container');
const elCardZh = document.getElementById('card-zh');
const elCardKo = document.getElementById('card-ko');
const elCardZhBack = document.getElementById('card-zh-back');
const elCardId = document.getElementById('card-id');
const elRatingArea = document.getElementById('rating-area');
const elCardArea = document.getElementById('card-area');
const elEmptyState = document.getElementById('empty-state');
const elStatNew = document.getElementById('stat-new');
const elStatReview = document.getElementById('stat-review');
const elStatDone = document.getElementById('stat-done');
const elProgressFill = document.getElementById('progress-fill');
const elIntervalAgain = document.getElementById('interval-again');
const elIntervalHard = document.getElementById('interval-hard');
const elIntervalGood = document.getElementById('interval-good');
const elIntervalEasy = document.getElementById('interval-easy');

// ===== Init =====
function init() {
  loadCards();
  buildQueue();
  sessionTotal = queue.length;
  sessionDone = 0;
  updateStats();
  showCurrentCard();
}

// ===== Storage =====
function loadCards() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      cards = JSON.parse(stored);
      // Ensure any new cards from cardData are merged in
      const existingIds = new Set(cards.map(c => c.id));
      for (const cd of cardData) {
        if (!existingIds.has(cd.id)) {
          cards.push(createCard(cd));
        }
      }
    } catch {
      cards = cardData.map(createCard);
    }
  } else {
    cards = cardData.map(createCard);
  }
  saveCards();
}

function saveCards() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
}

function createCard(data) {
  return {
    id: data.id,
    zh: data.zh,
    ko: data.ko,
    interval: 0,
    repetition: 0,
    easeFactor: 2.5,
    nextReview: Date.now()
  };
}

// ===== Queue =====
function buildQueue() {
  const now = Date.now();
  queue = cards
    .filter(c => c.nextReview <= now)
    .sort((a, b) => a.nextReview - b.nextReview);
  currentIndex = 0;
}

// ===== SM-2 Algorithm =====
function sm2(card, quality) {
  // quality: 0 = Again, 2 = Hard, 3 = Good, 5 = Easy
  let { interval, repetition, easeFactor } = card;

  if (quality < 3) {
    // Failed: reset
    repetition = 0;
    interval = 0;
  } else {
    // Passed
    if (repetition === 0) {
      interval = 1;
    } else if (repetition === 1) {
      interval = 6;
    } else {
      interval = Math.round(interval * easeFactor);
    }
    repetition++;
  }

  // Update ease factor
  easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (easeFactor < 1.3) easeFactor = 1.3;

  // Hard penalty: reduce interval by 15%
  if (quality === 2) {
    interval = Math.max(1, Math.round(interval * 0.85));
  }

  // Easy bonus: multiply interval by 1.3
  if (quality === 5) {
    interval = Math.round(interval * 1.3);
  }

  // Calculate next review timestamp
  let nextReview;
  if (interval === 0) {
    // Show again in 1 minute
    nextReview = Date.now() + MS_PER_MIN;
  } else {
    nextReview = Date.now() + interval * MS_PER_DAY;
  }

  return { interval, repetition, easeFactor, nextReview };
}

// Predict interval for UI labels
function predictInterval(card, quality) {
  const result = sm2({ ...card }, quality);
  return result.interval;
}

function formatInterval(days) {
  if (days === 0) return '< 1 分';
  if (days === 1) return '1 天';
  if (days < 30) return days + ' 天';
  if (days < 365) return Math.round(days / 30) + ' 月';
  return (days / 365).toFixed(1) + ' 年';
}

// ===== Display =====
function showCurrentCard() {
  if (queue.length === 0 || currentIndex >= queue.length) {
    // No more cards
    elCardArea.classList.add('hidden');
    elRatingArea.classList.add('hidden');
    elEmptyState.classList.add('visible');
    updateStats();
    return;
  }

  elCardArea.classList.remove('hidden');
  elEmptyState.classList.remove('visible');

  const card = queue[currentIndex];

  // Reset flip state
  isFlipped = false;
  elCardContainer.classList.remove('flipped');
  elRatingArea.classList.add('hidden');

  // Populate
  elCardZh.textContent = card.zh;
  elCardKo.textContent = card.ko;
  elCardZhBack.textContent = card.zh;
  elCardId.textContent = '#' + card.id;

  // Update interval previews
  elIntervalAgain.textContent = formatInterval(predictInterval(card, 0));
  elIntervalHard.textContent = formatInterval(predictInterval(card, 2));
  elIntervalGood.textContent = formatInterval(predictInterval(card, 3));
  elIntervalEasy.textContent = formatInterval(predictInterval(card, 5));

  // Re-trigger entrance animation
  elCardContainer.style.animation = 'none';
  void elCardContainer.offsetHeight; // reflow
  elCardContainer.style.animation = '';

  updateStats();
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  elCardContainer.classList.add('flipped');
  elRatingArea.classList.remove('hidden');

  // Speak Korean
  speakKorean(queue[currentIndex].ko);
}

// ===== Rating =====
function rateCard(quality) {
  const card = queue[currentIndex];
  const updated = sm2(card, quality);

  // Apply to master deck
  const masterCard = cards.find(c => c.id === card.id);
  if (masterCard) {
    masterCard.interval = updated.interval;
    masterCard.repetition = updated.repetition;
    masterCard.easeFactor = updated.easeFactor;
    masterCard.nextReview = updated.nextReview;
  }

  saveCards();
  sessionDone++;

  // If "Again" (quality 0), re-insert at end of queue
  if (quality === 0) {
    const failedCard = { ...masterCard };
    queue.push(failedCard);
  }

  currentIndex++;
  showCurrentCard();
}

// ===== Stats =====
function updateStats() {
  let newCount = 0;
  let reviewCount = 0;

  for (let i = currentIndex; i < queue.length; i++) {
    const c = queue[i];
    if (c.repetition === 0 && c.interval === 0) {
      newCount++;
    } else {
      reviewCount++;
    }
  }

  elStatNew.textContent = newCount;
  elStatReview.textContent = reviewCount;
  elStatDone.textContent = sessionDone;

  // Progress bar
  const total = sessionTotal > 0 ? sessionTotal : 1;
  const pct = Math.min(100, Math.round((sessionDone / total) * 100));
  elProgressFill.style.width = pct + '%';
}

// ===== TTS =====
function speakKorean(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.85;
  utter.pitch = 1;

  // Try to find a Korean voice
  const voices = window.speechSynthesis.getVoices();
  const koVoice = voices.find(v => v.lang.startsWith('ko'));
  if (koVoice) utter.voice = koVoice;

  window.speechSynthesis.speak(utter);
}

// Ensure voices are loaded (some browsers load async)
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();
}

// ===== Reset =====
function resetAllProgress() {
  if (!confirm('確定要重設所有學習進度嗎？此動作無法復原。')) return;
  cards = cardData.map(createCard);
  saveCards();
  buildQueue();
  sessionTotal = queue.length;
  sessionDone = 0;
  elEmptyState.classList.remove('visible');
  showCurrentCard();
}

// ===== Boot =====
document.addEventListener('DOMContentLoaded', init);
</script>

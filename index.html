<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>韓語閃卡 · 情境 SRS</title>
<meta name="description" content="韓語旅遊會話情境練習 App">

<!-- PWA / iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="韓語對話">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --surface-light: #2a2a2a;
  --primary: #bb86fc;
  --primary-dim: #9a67db;
  --secondary: #03dac6;
  --accent: #ffb74d;
  --error: #cf6679;
  --warning: #ffb74d;
  --success: #81c784;
  --on-bg: #e0e0e0;
  --on-surface: #ffffff;
  --on-muted: #888888;
  --radius: 20px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--on-bg);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== App Shell ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding: env(safe-area-inset-top, 20px) 16px calc(var(--safe-bottom) + 12px);
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 12px 0 8px;
  flex-shrink: 0;
}

.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

/* ===== Stats Bar ===== */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px 0 6px;
  flex-shrink: 0;
}

.stat { text-align: center; }

.stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1;
}

.stat-label {
  font-size: 0.7rem;
  color: var(--on-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}

.stat-new .stat-value { color: var(--secondary); }
.stat-review .stat-value { color: var(--primary); }
.stat-done .stat-value { color: var(--success); }

/* ===== Progress Bar ===== */
.progress-wrap {
  width: 100%;
  height: 4px;
  background: var(--surface-light);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}

/* ===== Card Area ===== */
.card-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 4px 0;
}

/* ===== Single Card ===== */
.card-container {
  width: 100%;
  max-width: 380px;
  aspect-ratio: 3 / 4;
  max-height: 100%;
  cursor: pointer;
  position: relative;
  background: linear-gradient(145deg, #1f1f3a, #1a1a2e);
  border: 1px solid rgba(187, 134, 252, 0.15);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  text-align: center;
  overflow: hidden;
  transition: opacity 0.25s ease, transform 0.25s ease, background 0.3s ease;
}

.card-container.answer-mode {
  background: linear-gradient(145deg, #1a2e1a, #1e2d1e);
  border: 1px solid rgba(3, 218, 198, 0.15);
}

.card-container.fade-out {
  opacity: 0;
  transform: scale(0.97);
}

.card-badge {
  position: absolute;
  top: 16px;
  left: 20px;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--on-muted);
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.05);
}

.card-id {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 0.65rem;
  color: var(--on-muted);
  font-weight: 600;
}

/* Content Layout */
.content-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
}

.text-ko {
  font-size: 1.8rem;
  font-weight: 700;
  line-height: 1.4;
}
.question-mode .text-ko { color: var(--accent); }
.answer-mode .text-ko { color: var(--secondary); }

.text-zh {
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--on-surface);
  line-height: 1.45;
}

.speaker-icon {
  margin-top: 8px;
  font-size: 1.4rem;
  opacity: 0.5;
  animation: pulse-speaker 2s infinite;
}

@keyframes pulse-speaker {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* ===== Action Area (Bottom) ===== */
.action-area {
  flex-shrink: 0;
  padding: 12px 0 4px;
  min-height: 68px; /* reserve space to prevent jumping */
}

/* Next Button */
.btn-next-wrap {
  display: flex;
  width: 100%;
}
.btn-next {
  flex: 1;
  border: none;
  border-radius: 16px;
  padding: 18px 4px;
  font-size: 1.1rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn-next:active { transform: scale(0.96); }

/* Rating Buttons */
.rating-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.btn-rate {
  border: none;
  border-radius: 14px;
  padding: 14px 4px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-height: 56px;
  -webkit-tap-highlight-color: transparent;
}
.btn-rate:active { transform: scale(0.93); }
.btn-rate .btn-interval {
  font-size: 0.6rem;
  font-weight: 500;
  opacity: 0.7;
}
.btn-again { background: rgba(207, 102, 121, 0.2); color: var(--error); border: 1px solid rgba(207, 102, 121, 0.3); }
.btn-hard { background: rgba(255, 183, 77, 0.15); color: var(--warning); border: 1px solid rgba(255, 183, 77, 0.25); }
.btn-good { background: rgba(129, 199, 132, 0.15); color: var(--success); border: 1px solid rgba(129, 199, 132, 0.25); }
.btn-easy { background: rgba(3, 218, 198, 0.15); color: var(--secondary); border: 1px solid rgba(3, 218, 198, 0.25); }

/* ===== End State ===== */
.empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 16px;
  padding: 40px 20px;
  flex: 1;
}
.empty-state.visible { display: flex; }
.empty-icon { font-size: 4rem; opacity: 0.7; }
.empty-title { font-size: 1.4rem; font-weight: 700; color: var(--on-surface); }
.empty-subtitle { font-size: 0.9rem; color: var(--on-muted); line-height: 1.5; }
.btn-reset {
  margin-top: 12px;
  padding: 14px 32px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.btn-reset:active { transform: scale(0.95); }

/* ===== Utility ===== */
.hidden { display: none !important; }

/* ===== Responsive Tweaks ===== */
@media (max-height: 667px) {
  .text-zh { font-size: 1.25rem; }
  .text-ko { font-size: 1.5rem; }
  .card-container { aspect-ratio: 4 / 5; }
  .btn-rate { padding: 10px 4px; min-height: 48px; font-size: 0.8rem; }
  .stats-bar { gap: 14px; padding: 6px 0; }
  .stat-value { font-size: 1.3rem; }
}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <h1>🇰🇷 情境 SRS 特訓</h1>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat stat-new">
      <div class="stat-value" id="stat-new">0</div>
      <div class="stat-label">新題</div>
    </div>
    <div class="stat stat-review">
      <div class="stat-value" id="stat-review">0</div>
      <div class="stat-label">複習</div>
    </div>
    <div class="stat stat-done">
      <div class="stat-value" id="stat-done">0</div>
      <div class="stat-label">完成</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Card -->
  <div class="card-area" id="card-area">
    <div class="card-container question-mode" id="card-container" onclick="handleCardClick()">
      <div class="card-badge" id="card-badge">聽力問題</div>
      <div class="card-id" id="card-id">#1</div>
      
      <div class="content-wrapper">
        <div class="text-ko" id="text-ko"></div>
        <div class="speaker-icon" id="speaker-icon">🔊</div>
        <div class="text-zh" id="text-zh">載入中…</div>
      </div>
    </div>
  </div>

  <!-- End State -->
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🎉</div>
    <div class="empty-title">今日訓練完成！</div>
    <div class="empty-subtitle">太棒了，所有情境都已複習完畢。<br>明天再回來繼續學習吧！</div>
    <button class="btn-reset" onclick="resetAllProgress()">重設所有進度</button>
  </div>

  <!-- Action Area -->
  <div class="action-area" id="action-area">
    <!-- Show Answer Button -->
    <div class="btn-next-wrap" id="btn-next-wrap">
      <button class="btn-next" onclick="showAnswer()">你的應對 ➡️</button>
    </div>
    <!-- Rating Buttons -->
    <div class="rating-buttons hidden" id="rating-area">
      <button class="btn-rate btn-again" onclick="rateCard(0)">
        <span>重來</span>
        <span class="btn-interval" id="interval-again"></span>
      </button>
      <button class="btn-rate btn-hard" onclick="rateCard(2)">
        <span>困難</span>
        <span class="btn-interval" id="interval-hard"></span>
      </button>
      <button class="btn-rate btn-good" onclick="rateCard(3)">
        <span>良好</span>
        <span class="btn-interval" id="interval-good"></span>
      </button>
      <button class="btn-rate btn-easy" onclick="rateCard(5)">
        <span>簡單</span>
        <span class="btn-interval" id="interval-easy"></span>
      </button>
    </div>
  </div>
</div>

<script>
// Q&A Conversational Dataset
const rawCardData = [

  { id: 43, type: "求助情境", q_ko: "", q_zh: "需要買成藥...", a_ko: "가장 가까운 약국이 어디예요?", a_zh: "最近的藥局在哪裡？" },
  { id: 44, type: "極端狀況", q_ko: "", q_zh: "身體非常不舒服...", a_ko: "너무 아파요. 병원에 가야 해요.", a_zh: "我非常不舒服，必須去醫院。" },
  { id: 45, type: "極端狀況", q_ko: "", q_zh: "發現錢包不見了...", a_ko: "지갑을 잃어버렸어요.", a_zh: "我弄丟了錢包。" },
  { id: 46, type: "極端狀況", q_ko: "", q_zh: "發現護照不見了...", a_ko: "여권을 잃어버렸어요.", a_zh: "我弄丟了護照。" },
  { id: 47, type: "極端狀況", q_ko: "", q_zh: "聽不懂對方說什麼...", a_ko: "다시 한번 말씀해 주시겠어요?", a_zh: "可以請您再說一次嗎？" },
  { id: 48, type: "極端狀況", q_ko: "", q_zh: "對方講太多韓文...", a_ko: "한국어를 잘 못해요.", a_zh: "我的韓文不太好。" },
  { id: 49, type: "極端狀況", q_ko: "", q_zh: "想切換語言...", a_ko: "혹시 영어 하실 수 있나요?", a_zh: "請問您會說英文嗎？" },
  { id: 50, type: "極端狀況", q_ko: "", q_zh: "需要時間溝通...", a_ko: "번역기 돌릴게요. 잠시만요.", a_zh: "我用一下翻譯軟體，請稍等。" }
];

// ===== Constants =====
const STORAGE_KEY = 'korean-srs-qa-cards';
const MS_PER_DAY = 86400000;
const MS_PER_MIN = 60000;

// ===== State =====
let cards = [];
let queue = [];
let currentIndex = 0;
let isAnswerState = false;
let sessionDone = 0;
let sessionTotal = 0;
let isAnimating = false;

// ===== DOM Refs =====
const elCardContainer = document.getElementById('card-container');
const elCardBadge = document.getElementById('card-badge');
const elCardId = document.getElementById('card-id');
const elTextKo = document.getElementById('text-ko');
const elTextZh = document.getElementById('text-zh');
const elSpeaker = document.getElementById('speaker-icon');
const elBtnNextWrap = document.getElementById('btn-next-wrap');
const elRatingArea = document.getElementById('rating-area');
const elCardArea = document.getElementById('card-area');
const elActionArea = document.getElementById('action-area');
const elEmptyState = document.getElementById('empty-state');
const elStatNew = document.getElementById('stat-new');
const elStatReview = document.getElementById('stat-review');
const elStatDone = document.getElementById('stat-done');
const elProgressFill = document.getElementById('progress-fill');
const elStatsBar = document.getElementById('stats-bar');
const elProgressWrap = document.getElementById('progress-wrap');

const elIntervals = {
  0: document.getElementById('interval-again'),
  2: document.getElementById('interval-hard'),
  3: document.getElementById('interval-good'),
  5: document.getElementById('interval-easy')
};

// ===== Init =====
function init() {
  loadCards();
  buildQueue();
  sessionTotal = queue.length;
  sessionDone = 0;
  updateStats();
  renderCurrentState();
}

// ===== Storage =====
function loadCards() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      cards = JSON.parse(stored);
      const existingIds = new Set(cards.map(c => c.id));
      for (const cd of rawCardData) {
        if (!existingIds.has(cd.id)) {
          cards.push(createCard(cd));
        } else {
          // Update data fields in case they changed, keeping SRS fields
          const existing = cards.find(c => c.id === cd.id);
          Object.assign(existing, cd);
        }
      }
    } catch {
      cards = rawCardData.map(createCard);
    }
  } else {
    cards = rawCardData.map(createCard);
  }
  saveCards();
}

function saveCards() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
}

function createCard(data) {
  return {
    ...data,
    interval: 0,
    repetition: 0,
    easeFactor: 2.5,
    nextReview: Date.now()
  };
}

// ===== Queue & Stats =====
function buildQueue() {
  const now = Date.now();
  queue = cards
    .filter(c => c.nextReview <= now)
    .sort((a, b) => a.nextReview - b.nextReview);
  currentIndex = 0;
}

function updateStats() {
  let newCount = 0;
  let reviewCount = 0;

  for (let i = currentIndex; i < queue.length; i++) {
    const c = queue[i];
    if (c.repetition === 0 && c.interval === 0) {
      newCount++;
    } else {
      reviewCount++;
    }
  }

  elStatNew.textContent = newCount;
  elStatReview.textContent = reviewCount;
  elStatDone.textContent = sessionDone;

  const total = sessionTotal > 0 ? sessionTotal : 1;
  const pct = Math.min(100, Math.round((sessionDone / total) * 100));
  elProgressFill.style.width = pct + '%';
}

// ===== SM-2 Algorithm =====
function sm2(card, quality) {
  let { interval, repetition, easeFactor } = card;

  if (quality < 3) {
    repetition = 0;
    interval = 0;
  } else {
    if (repetition === 0) interval = 1;
    else if (repetition === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetition++;
  }

  easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (easeFactor < 1.3) easeFactor = 1.3;

  if (quality === 2) interval = Math.max(1, Math.round(interval * 0.85));
  if (quality === 5) interval = Math.round(interval * 1.3);

  let nextReview;
  if (interval === 0) {
    nextReview = Date.now() + MS_PER_MIN; // 1 min for again
  } else {
    nextReview = Date.now() + interval * MS_PER_DAY;
  }

  return { interval, repetition, easeFactor, nextReview };
}

function predictInterval(card, quality) {
  return sm2({ ...card }, quality).interval;
}

function formatInterval(days) {
  if (days === 0) return '< 1 分';
  if (days === 1) return '1 天';
  if (days < 30) return days + ' 天';
  if (days < 365) return Math.round(days / 30) + ' 月';
  return (days / 365).toFixed(1) + ' 年';
}

// ===== Interaction =====
function handleCardClick() {
  if (isAnimating) return;
  if (!isAnswerState) showAnswer();
  // If in answer state, we wait for a rating button click, so do nothing on card click.
}

function showAnswer() {
  if (isAnimating || queue.length === 0) return;
  isAnimating = true;
  elCardContainer.classList.add('fade-out');
  
  setTimeout(() => {
    isAnswerState = true;
    renderCurrentState();
    elCardContainer.classList.remove('fade-out');
    setTimeout(() => { isAnimating = false; }, 250);
  }, 200);
}

function rateCard(quality) {
  if (isAnimating) return;
  
  const card = queue[currentIndex];
  const updated = sm2(card, quality);

  const masterCard = cards.find(c => c.id === card.id);
  if (masterCard) {
    masterCard.interval = updated.interval;
    masterCard.repetition = updated.repetition;
    masterCard.easeFactor = updated.easeFactor;
    masterCard.nextReview = updated.nextReview;
  }
  
  saveCards();
  sessionDone++;

  if (quality === 0) {
    queue.push({ ...masterCard });
  }

  currentIndex++;
  isAnswerState = false;
  
  isAnimating = true;
  elCardContainer.classList.add('fade-out');
  setTimeout(() => {
    renderCurrentState();
    elCardContainer.classList.remove('fade-out');
    setTimeout(() => { isAnimating = false; }, 250);
  }, 200);
}

// ===== Render =====
function renderCurrentState() {
  if (queue.length === 0 || currentIndex >= queue.length) {
    showEndState();
    updateStats();
    return;
  }

  const card = queue[currentIndex];
  elCardId.textContent = '#' + card.id;

  if (isAnswerState) {
    // Answer Mode
    elCardContainer.classList.add('answer-mode');
    elCardContainer.classList.remove('question-mode');
    elCardBadge.textContent = '你的應對';
    
    elTextKo.style.display = 'block';
    elTextKo.textContent = card.a_ko;
    elTextZh.textContent = card.a_zh;
    elSpeaker.style.display = 'block';
    
    elBtnNextWrap.classList.add('hidden');
    elRatingArea.classList.remove('hidden');

    // Update interval previews
    elIntervals[0].textContent = formatInterval(predictInterval(card, 0));
    elIntervals[2].textContent = formatInterval(predictInterval(card, 2));
    elIntervals[3].textContent = formatInterval(predictInterval(card, 3));
    elIntervals[5].textContent = formatInterval(predictInterval(card, 5));

    speakKorean(card.a_ko);
  } else {
    // Question/Prompt Mode
    elCardContainer.classList.remove('answer-mode');
    elCardContainer.classList.add('question-mode');
    elCardBadge.textContent = card.type;
    
    if (card.q_ko) {
      elTextKo.style.display = 'block';
      elTextKo.textContent = card.q_ko;
      elSpeaker.style.display = 'block';
      speakKorean(card.q_ko);
    } else {
      elTextKo.style.display = 'none';
      elSpeaker.style.display = 'none';
    }
    elTextZh.textContent = card.q_zh;
    
    elBtnNextWrap.classList.remove('hidden');
    elRatingArea.classList.add('hidden');
  }

  updateStats();
}

function showEndState() {
  elCardArea.classList.add('hidden');
  elActionArea.classList.add('hidden');
  elStatsBar.classList.add('hidden');
  elProgressWrap.classList.add('hidden');
  elEmptyState.classList.add('visible');
}

function resetAllProgress() {
  if (!confirm('確定要重設所有學習進度嗎？此動作無法復原。')) return;
  cards = rawCardData.map(createCard);
  saveCards();
  buildQueue();
  sessionTotal = queue.length;
  sessionDone = 0;
  isAnswerState = false;
  
  elEmptyState.classList.remove('visible');
  elCardArea.classList.remove('hidden');
  elActionArea.classList.remove('hidden');
  elStatsBar.classList.remove('hidden');
  elProgressWrap.classList.remove('hidden');
  
  renderCurrentState();
}

// ===== TTS =====
function speakKorean(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.85;
  utter.pitch = 1;

  const voices = window.speechSynthesis.getVoices();
  const koVoice = voices.find(v => v.lang.startsWith('ko'));
  if (koVoice) utter.voice = koVoice;

  window.speechSynthesis.speak(utter);
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();
}

document.addEventListener('DOMContentLoaded', init);
</script>
